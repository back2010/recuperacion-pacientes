/* ---------- Filtros y universo ---------- */

}
function uniOk(f, uni) { switch (uni) { case 'gestion': return !f.auto && !f.reasig; case 'reasig': return f.reasig; case 'todos': return true; case 'otros': return !f.encuesta; case 'encuesta': return f.encuesta; case 'encManual': return f.encuesta && !f.auto; case 'encAuto': return f.encuesta && f.auto; default: return true; } }
function geoOk(f) { const fl = S.flt; return (!fl.zona || f.zona === fl.zona) && (!fl.suc || f.sucursal === fl.suc) && (!fl.coord || f.coord === fl.coord); }
function baseFilter(opt = {}) { const fl = S.flt; const uni = opt.universo ?? fl.universo; return f => (opt.ejec ? f.owner === opt.ejec : (!fl.ejec || f.owner === fl.ejec)) && geoOk(f) && uniOk(f, uni); }

/* ---------- Indicadores ---------- */
function metrics(fs) {
  const m = { n: fs.length, regs: 0, cerr: 0, pend: 0, seg: 0, term: 0, canc: 0, otro: 0, proc: 0, noproc: 0, sindef: 0, sinclas: 0, encN: 0 };
  const hfs = [], hc = [], cd = []; const apMax = S.cfg.apDias, cMax = S.cfg.cierreDias;
  const apDist = Array(apMax + 2).fill(0), cDist = Array(cMax + 2).fill(0); const k = { fsOk: 0, fsBad: 0, fsVen: 0, fsPl: 0, fsSd: 0, cOk: 0, cBad: 0, cVen: 0, cPl: 0, cSd: 0, c7Ok: 0, c7Bad: 0, c7Ven: 0, c7Pl: 0, c7Sd: 0, atc: 0, ext: 0, auto: 0 };
  const inc = (pre, st) => { if (st === 'cumple') k[pre + 'Ok']++; else if (st === 'fuera') k[pre + 'Bad']++; else if (st === 'vencido') k[pre + 'Ven']++; else if (st === 'plazo') k[pre + 'Pl']++; else if (st === 'sd') k[pre + 'Sd']++; };

    // Conteo por d\u00eda: en qu\u00e9 d\u00eda desde el registro fue el primer comentario y el cierre (\u00faltima casilla = vencidos)
    if (f.cls !== 'cancelado') { if (f.apDias != null) apDist[Math.min(f.apDias, apMax + 1)]++; if (f.cls === 'cerrado' && f.cDias != null) { cDist[Math.min(f.cDias, cMax + 1)]++; cd.push(f.cDias); } }

    if (f.atClin === 'SI') k.atc++; if (f.expTec === 'SI') k.ext++;
    if (f.aud) { aud.n++; aud[f.aud.cal]++; aud.score.push(f.aud.score); for (let i = 0; i < 9; i++) { if (f.aud.crit[i] === 'N') aud.crit[i]++; else if (f.aud.crit[i] === 'P') aud.critP[i]++; } }

  m.pctCierre = ratio(m.cerr, m.eleg); m.pctProc = ratio(m.proc, m.proc + m.noproc);
  m.avgFs = mean(hfs); m.avgC = mean(hc); m.medC = median(hc); m.medFs = median(hfs);
  m.slaFs = ratio(k.fsOk, k.fsOk + k.fsBad + k.fsVen);

  const meta = S.cfg.tiempoRanking === '7D' ? 'c7' : 'c';
  m.cerrEnT = k[meta + 'Ok']; m.cerrFuera = k[meta + 'Bad']; m.vencidos = k[meta + 'Ven']; m.pendPlazo = k[meta + 'Pl'];
  m.cumpT = ratio(m.cerrEnT, m.cerr + m.vencidos);

  m.apOk = k.fsOk; m.apTarde = k.fsBad; m.apSinCom = k.fsVen; m.apVenc = k.fsBad + k.fsVen; m.apPl = k.fsPl;
  m.cOkT = k.c7Ok; m.cTarde = k.c7Bad; m.cAbVen = k.c7Ven; m.cVenc = k.c7Bad + k.c7Ven; m.cPl = k.c7Pl;

function sdev(a) { const v = a.filter(x => x != null && !isNaN(x)); if (v.length < 2) return null; const mu = v.reduce((x, y) => x + y, 0) / v.length; return Math.sqrt(v.reduce((x, y) => x + (y - mu) ** 2, 0) / (v.length - 1)); }
/** Sem\u00e1foro de vencidos: verde \u2264 SEM_VERDE_PCT y sin abiertos vencidos; amarillo \u2264 SEM_AMARILLO_PCT; rojo arriba. */
function semVenc(p, abiertosVenc) { if (p == null) return 'na'; const c = S.cfg; if (p <= c.semVerde && !abiertosVenc) return 'ok'; if (p <= c.semAmarillo) return 'warn'; return 'bad'; }
/** Indicadores y ranking por ejecutiva. Ver Metodolog\u00eda para las f\u00f3rmulas. */
function execStats(range, opt = {}) {
  const t = opt.lista || team(); const out = [];
  const uni = opt.universo ?? S.flt.universo;
  const coh = S.folios.filter(f => !f.auto && (uni === 'reasig' || !f.reasig) && uniOk(f, uni) && inR(f.fReg, range) && geoOk(f));
  const closedR = S.folios.filter(f => !f.auto && (uni === 'reasig' || !f.reasig) && uniOk(f, uni) && f.fCierre != null && inR(f.fCierre, range) && geoOk(f));
  const byOwner = new Map(); for (const f of coh) { if (!byOwner.has(f.owner)) byOwner.set(f.owner, []); byOwner.get(f.owner).push(f); }
  for (const e of t) {
    const own = byOwner.get(e) || [];
    const m = metrics(own);
    m.ejec = e; m.coord = S.coordDe.get(e) || null; m.asign = own.length;
    m.gestionados = coh.filter(f => f.authors.includes(e)).length;
    m.cerrAcred = coh.filter(f => f.cls === 'cerrado' && f.closer === e).length;
    m.cerrAcredT = coh.filter(f => f.cls === 'cerrado' && f.closer === e && slaMeta(f) === 'cumple').length;
    m.cierresPeriodo = closedR.filter(f => f.closer === e).length;
    let gest = 0; const gm = S.gest.get(e); if (gm) for (const [d, arr] of gm) if (inR(d, range)) for (const x of arr) if (uniOk(x, uni)) gest++;
    m.gestiones = gest;

    // carga diaria: folios distintos con gesti\u00f3n suya por d\u00eda (solo d\u00edas con actividad)
    const porDia = []; if (gm) for (const [d, arr] of gm) if (inR(d, range)) { const n = new Set(arr.filter(x => uniOk(x, uni)).map(x => x.folio)).size; if (n) porDia.push(n); }

    m.enc = { total: encAll.length, auto: encAll.filter(f => f.auto).length, manual: encAll.filter(f => !f.auto).length, manualCerr: encAll.filter(f => !f.auto && f.cls === 'cerrado').length };
    m.motivos = countBy(own.flatMap(f => f.motivos), x => x).slice(0, 8);
    m.areasTop = countBy(own.flatMap(f => f.areas), x => x).slice(0, 8);
    m.causas = countBy(own.filter(f => f.aud), f => f.aud.causa).slice(0, 8);
    m.nivel = m.eleg >= 100 ? 'Alto' : m.eleg >= S.cfg.minFolios ? 'Medio' : m.eleg > 0 ? 'Insuficiente' : 'Sin datos';

    m.score = (m.sP != null && m.sR != null && m.sO != null) ? (c.wP * m.sP + c.wR * m.sR + c.wO * m.sO) / (c.wP + c.wR + c.wO) : null;

/** M\u00e9tricas del periodo anterior; si no hay datos de ese periodo devuelve un objeto vac\u00edo (sin comparativo). */

function hayDatos(r) { const out = []; for (let k = mesKey(r.from); mesFrom(k) <= r.to;) { out.push(k); const d = dt(mesFrom(k)); k = mesKey(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1)); } return out.some(m => S.ses.meses.includes(m)); }
function metricsPrev(p, opt) { return p && hayDatos(p) ? metrics(cohort(p, opt)) : NULLM; }
function maturity(r) { if (!r) return { ok: true }; const days = (nowNaive() - r.to) / D; return { ok: days >= S.cfg.madurezDias, days }; }
/** Alertas por ejecutiva: tiempos, pendientes, deterioro y patrones de auditor\u00eda. */

    if (enough && m.slaFs != null && medFs != null) { const g = (medFs - m.slaFs) * 100; if (g >= a.slaCritPP) push('critica', '1er comentario en ' + S.cfg.apDias + ' d\u00edas', `${fmtP(m.slaFs)} vs mediana ${fmtP(medFs)} (\u2212${g.toFixed(1)} pp)`, 'Asegurar primer contacto el mismo d\u00eda de asignaci\u00f3n; revisar distribuci\u00f3n de carga y horario de llamadas.'); else if (g >= a.slaPrevPP) push('preventiva', '1er comentario en ' + S.cfg.apDias + ' d\u00edas', `${fmtP(m.slaFs)} vs mediana ${fmtP(medFs)} (\u2212${g.toFixed(1)} pp)`, 'Reforzar el primer contacto dentro de las primeras 24 h.'); }
    if (m.vencidos > 0) push('critica', 'Folios abiertos vencidos (+7 d\u00edas)', `${m.vencidos} folio(s) abiertos con m\u00e1s de ${S.cfg.cierreDias} d\u00edas desde el registro`, 'Ninguna ejecutiva debe tener folios vencidos: atenderlos hoy, cerrar los que ya tienen respuesta y escalar los que dependen de cl\u00ednica.');
    if (false && m.vencidos >= a.vencCrit) push('critica', 'Folios que contin\u00faan vencidos', `${m.vencidos} folios abiertos fuera de ${metaLbl()}`, 'Depurar la bandeja: revisar uno a uno los vencidos, cerrar los que ya tienen respuesta y escalar los que dependen de cl\u00ednica.'); else if (m.vencidos >= a.vencPrev) push('preventiva', 'Folios que contin\u00faan vencidos', `${m.vencidos} folios abiertos fuera de ${metaLbl()}`, 'Programar bloque de depuraci\u00f3n de pendientes.');
    if (m.fsVen > 0) push('critica', 'Sin comentario en APERTURA (d\u00eda ' + (S.cfg.apDias + 1) + '+)', `${m.fsVen} folio(s) siguen en APERTURA sin comentario con m\u00e1s de ${S.cfg.apDias} d\u00edas desde el registro`, 'Contactar hoy a estos pacientes; si la carga lo impide, redistribuir folios.');
    if (false && m.fsVen >= a.sinSegCrit) push('critica', 'Sin primer comentario', `${m.fsVen} folios sin comentario y con m\u00e1s de ${S.cfg.apDias} d\u00edas`, 'Contactar hoy a estos pacientes; si la carga lo impide, redistribuir folios.'); else if (m.fsVen >= a.sinSegPrev) push('preventiva', 'Sin primer comentario', `${m.fsVen} folios sin comentario vencidos`, 'Verificar folios sin contacto y registrar gesti\u00f3n.');

    }

const UNI_LBL = { gestion: 'Gesti\u00f3n de ejecutivas (sin cierres autom\u00e1ticos ni reasignados)', reasig: 'Solo folios reasignados', otros: 'Sin encuesta digital', encuesta: 'Solo encuesta digital', encManual: 'Encuesta digital \u00b7 gesti\u00f3n manual', encAuto: 'Encuesta digital \u00b7 cierre autom\u00e1tico', todos: 'Todos (incluye cierres autom\u00e1ticos)' };

  const f = S.fMap.get(String(folio));
  const rows = d.rows; const r0 = rows[0];

function groupStats(fs, keyFn, rowLevel) {
  const g = new Map();
  for (const f of fs) { const keys = rowLevel ? [...new Set(f.rows.map(rowLevel))] : [keyFn(f)]; for (const k of keys) { if (!k) continue; if (!g.has(k)) g.set(k, []); g.get(k).push(f); } }
  return [...g].map(([k, arr]) => { const m = metrics(arr); let regs = 0, pr = 0, np = 0; for (const f of arr) for (const r of f.rows) if (!rowLevel || rowLevel(r) === k) { regs++; if (r.clasif === 'PROCEDE') pr++; else if (r.clasif === 'NO PROCEDE') np++; } return { k, n: arr.length, regs, pctProc: ratio(pr, pr + np), avgC: m.avgC, cumpT: m.cumpT, abiertos: m.abiertos, aud: m.aud.pA }; }).sort((a, b) => b.regs - a.regs);
}

/* ---------- Reporte gerencial ---------- */
function buildReport() {
  const r = curRange(), p = prevPeriod(r);
  const m = metrics(cohort(r)), q = metricsPrev(p);
  const ex = execStats(r).filter(x => x.score != null).sort((a, b) => b.score - a.score);
  const al = computeAlerts(r, p); const crit = al.filter(a => a.lvl === 'critica');
  const sucs = groupStats(cohort(r), f => f.sucursal).slice(0, 10);
  const causas = countBy(cohort(r).filter(f => f.aud && f.aud.causa !== 'No determinable'), f => f.aud.causa).slice(0, 6);
  const coords = S.ses.coordinadores.map(c => ({ c, m: metrics(cohort(r).filter(f => c.ejecutivas.includes(f.owner) && !f.auto)) }));
  const dir = (a, b, pp = true, inv = false) => { if (a == null || b == null) return 'sin comparativo disponible'; const d = pp ? (a - b) * 100 : a - b; if (Math.abs(d) < .05) return 'sin cambio'; return `${d > 0 ? 'aument\u00f3' : 'disminuy\u00f3'} ${pp ? Math.abs(d).toFixed(1) + ' pp' : fmtH(Math.abs(d))} (${(inv ? d < 0 : d > 0) ? 'mejora' : 'deterioro'})`; };
  const errs = CRIT.map((c, i) => [ERROR_LBL[c[0]], ratio(m.aud.crit[i], m.aud.n), c[0]]).filter(x => x[1] >= 0.15).sort((a, b) => b[1] - a[1]);
  const rec = [];
  const cnt = countBy(crit, a => a.ejec); if (cnt.length) rec.push(`Acompa\u00f1amiento individual, priorizando a quienes acumulan m\u00e1s alertas cr\u00edticas: ${cnt.slice(0, 5).map(([e, n]) => `${e} (${n})`).join(', ')}.`);
  if (m.vencidos) rec.push(`Depurar ${fmtN(m.vencidos)} folios que siguen vencidos (${metaLbl()}).`);
  if (m.fsVen) rec.push(`Atender de inmediato ${fmtN(m.fsVen)} folios que siguen en APERTURA sin comentario con m\u00e1s de ${S.cfg.apDias} d\u00edas.`);
  errs.slice(0, 3).forEach(([l, p, id]) => rec.push(`${l} en ${fmtP(p, 0)} de los folios auditados: ${RECOM[id]}`));
  return { r, p, m, q, ex, al, crit, sucs, causas, coords, dir, errs, rec };
}

function ultimoMesCerrado() { const d = dt(nowNaive()); return mesKey(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) - 1); }
function rangoMes(k) { const from = mesFrom(k); const d = dt(from); return { key: k, label: mesLabel(k), from, to: Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) - 1, tipo: 'mes' }; }
const metaTxt = (i, meta) => i.op === 'check' ? 'Cumple' : (i.op === '>=' ? '\u2265' : '\u2264') + meta + '%';
function pagoLabel(m) { return periodOf(m.to + 1, 'quincena').label; }
function tipoBono(total) { const n = S.ses.bono.niveles; return total >= n.A ? 'A' : total >= n.B ? 'B' : 'No aplica'; }
function tipoPill(t) { return t === 'A' ? '<span class="pill tag p-ok big">Bono A</span>' : t === 'B' ? '<span class="pill tag p-info big">Bono B</span>' : '<span class="pill tag p-n big">No aplica</span>'; }
const captCache = {};
async function captura(mes, force) { if (!captCache[mes] || force) { const r = await call('apiBonos', mes); captCache[mes] = {}; r.captura.forEach(x => captCache[mes][x['Ejecutiva']] = { mon: x['Monitoreo %'], aud: x['Auditor\u00eda %'], sat: String(x['Satisfacci\u00f3n (SI/NO)']).toUpperCase() === 'SI' }); } return captCache[mes]; }
function bonoIndicadores(e, r) {
  const bc = S.ses.bono; const el = S.folios.filter(f => f.owner === e && !f.auto && uniOk(f, S.flt.universo) && inR(f.fReg, r) && f.cls !== 'cancelado');
  let aOk = 0, aDen = 0, sdN = 0, sdDen = 0, cOk = 0, cDen = 0; const lim = bc.cierreDias; const now = S.cfg.corte === 'archivo' ? S.cutoffMs : nowNaive();
  for (const f of el) {
    if (f.slaFs === 'cumple') { aOk++; aDen++; } else if (f.slaFs === 'fuera' || f.slaFs === 'vencido') aDen++;
    if (f.cls === 'cerrado') for (const x of f.rows) { sdDen++; if (!x.clasif || x.clasif === 'SIN DEFINIR') sdN++; }
    const st = bc.cierreDesde === 'comentario' && f.fAp != null ? f.fAp : f.fReg;
    if (f.cls === 'cerrado' && f.fCierre != null) { cDen++; if (diasEntre(st, f.fCierre) <= lim) cOk++; } else if (f.open && diasEntre(st, now) > lim) cDen++;
  }
  return { n: el.length, ape: ratio(aOk, aDen), sd: ratio(sdN, sdDen), cie: ratio(cOk, cDen) };

function bonoEval(e, r, capt) {
  const bc = S.ses.bono; const v = bonoIndicadores(e, r); const c = (capt || {})[e] || {};

  const det = bc.ind.map(i => { const p = i[bc.esquema]; const val = vals[i.id] ?? null; const ok = val == null ? null : i.op === 'check' ? val === 1 : i.op === '>=' ? val * 100 >= p.meta - 1e-9 : val * 100 <= p.meta + 1e-9; return { ...i, meta: p.meta, pts: p.pts, val, ok, ganados: ok ? p.pts : 0 }; });

  return { e, v, det, total, maxPts, incompleto: det.some(d => d.val == null && d.fuente === 'manual'), insuf: v.n < S.cfg.minFolios };

/* ---------- Metodolog\u00eda ---------- */
function vMetodo(el) {
  const c = S.cfg;
  el.innerHTML = `<div class="glass card doc"><h1>Metodolog\u00eda, fuentes y f\u00f3rmulas</h1>
  <h2>1. Origen de la informaci\u00f3n</h2><ul><li><b>Disponible en el reporte:</b> folio, ejecutiva, sucursal, zona, \u00e1rea, motivo, estatus, fechas de registro / primer seguimiento / cierre, clasificaci\u00f3n, acciones correctivas, atenci\u00f3n de cl\u00ednica, experto t\u00e9cnico, impacto, causas (90% vac\u00eda) e historial de seguimiento.</li>
  <li><b>Calculado:</b> primer comentario de persona, tiempos, cumplimientos, qui\u00e9n cerr\u00f3, gestiones, auditor\u00eda, causa ra\u00edz inferida, alertas y bonos.</li>
  <li><b>Captura nueva (Google Sheets):</b> Usuarios, Equipos (coordinador de cada ejecutiva), Config, Bonos_Captura (monitoreo, auditor\u00eda externa, satisfacci\u00f3n) y Planes.</li></ul>
  <h2>2. Flujo de datos</h2><p>El Excel de origen (<code>${esc(S.ses.origen?.nombre || 'ARCHIVO_ORIGEN_ID')}</code>) vive en Drive \u2192 un activador horario revisa si cambi\u00f3; si cambi\u00f3, lo convierte a Google Sheets temporal, lo lee, consolida en la hoja <code>Folios</code> por llave <code>Folio|\u00c1rea|Subestudio|Motivo</code> (sin duplicar), registra cada cambio de campo en <code>Cambios</code>, audita los folios cerrados y genera un archivo de cach\u00e9 por mes. El dashboard carga por mes solo los folios que el usuario tiene permiso de ver.</p>
  <h2>3. Periodos</h2><p>Semanas Salud Digna de <b>s\u00e1bado a viernes</b> (corte el viernes); la semana 1 inicia el primer s\u00e1bado del a\u00f1o, de modo que el 31-oct\u20136-nov-2026 es la S44. Quincenas 1\u201315 y 16\u2013fin de mes. Todo se asigna por <b>Fecha Registro</b>; los cierres del periodo, por Fecha Cierre.</p>
  <h2>4. Tiempos</h2><table><tr><th>Indicador</th><th>F\u00f3rmula</th></tr>
  <tr><td><b>Apertura</b> (\u2264${c.apDias} d\u00edas)</td><td>Se cuenta en d\u00edas naturales, no en horas: el d\u00eda del registro es el d\u00eda 0. Termina con lo primero que ocurra: el primer comentario de una persona en el historial o la Fecha de primer seguimiento; un comentario ya cuenta aunque el estatus siga en APERTURA. Primer comentario a m\u00e1s tardar el d\u00eda ${c.apDias} = <b>en tiempo</b>; el d\u00eda ${c.apDias + 1} o despu\u00e9s = <b>vencida</b>. Sin comentario: a\u00fan a tiempo hasta el d\u00eda ${c.apDias} y <b>vencida</b> desde el d\u00eda ${c.apDias + 1}. Sin ninguna fecha: "sin fecha", no cuenta como vencida.</td></tr>
  <tr><td><b>Seguimiento</b> (≤${c.cierreDias} días)</td><td>Desde la Fecha Registro, el folio tiene ${c.cierreDias} días naturales para cerrarse (se cuenta por día, no por hora), esté en APERTURA, SEGUIMIENTO o TÉRMINO. Si el día ${c.cierreDias + 1} sigue abierto está <b>vencido</b>; si se cerró después, es cerrado tarde.</td></tr>
  <tr><td>Al día</td><td>Folios abiertos hoy: en APERTURA (en tiempo / vencidas) y en SEGUIMIENTO o TÉRMINO (en tiempo / vencidos). Hora de Mazatlán.</td></tr>
  <tr><td>A\u00fan a tiempo</td><td>Abiertos que todav\u00eda no cumplen el plazo (antes "en plazo").</td></tr>
  <tr><td>Fuera de la evaluaci\u00f3n</td><td>Cierres autom\u00e1ticos de encuesta digital y folios en el archivo de reasignados (Config \u2192 REASIGNADOS_ID): se cuentan aparte.</td></tr>
  <tr><td>Sem\u00e1foro de vencidos</td><td>Verde: \u2264${fmtP(c.semVerde, 0)} de vencidos y ning\u00fan pendiente vencido \u00b7 amarillo: \u2264${fmtP(c.semAmarillo, 0)} \u00b7 rojo: m\u00e1s.</td></tr>
  <tr><td>Desviaci\u00f3n est\u00e1ndar</td><td>Por ejecutiva: cu\u00e1nto var\u00edan los d\u00edas a cierre de sus folios alrededor de su promedio (ej. 5 \u00b1 3 d\u00edas). Se muestra junto con el m\u00e1ximo (su cierre m\u00e1s tardado). Tambi\u00e9n se calcula para cu\u00e1ntos folios distintos atiende por d\u00eda.</td></tr>
  <tr><td>Causa probable del vencimiento</td><td>Comentario m\u00e1s reciente del historial que menciona qu\u00e9 se esperaba (gerente/cl\u00ednica, experto t\u00e9cnico, reembolso, resultados/sistema, paciente no localizado, reasignaci\u00f3n).</td></tr>
  <tr><td>Cerrados en tiempo / fuera de tiempo</td><td>Folios cerrados dentro / fuera de la meta.</td></tr>
  <tr><td>Pendientes / siguen vencidos</td><td>Abiertos dentro de la meta / abiertos que ya la superaron.</td></tr>
  <tr><td>% cumplimiento en tiempo</td><td>Cerrados en tiempo \u00f7 (cerrados + siguen vencidos).</td></tr>
  <tr><td>% de cierre</td><td>Cerrados \u00f7 (folios \u2212 cancelados).</td></tr></table>
  <h2>5. Desempe\u00f1o general (cambio respecto a la versi\u00f3n anterior)</h2><ul>
  <li><b>Productividad</b> = ${c.prodVol}% \u00d7 (cierres <u>en tiempo</u> acreditados \u00f7 m\u00e1ximo del equipo) + ${100 - c.prodVol}% \u00d7 (gestionados \u00f7 asignados). <i>Antes contaba todos los cierres; ahora solo los oportunos, para no premiar volumen cerrado fuera de tiempo.</i></li>
  <li><b>Resoluci\u00f3n</b> = % de cierre.</li><li><b>Oportunidad</b> = promedio de (1er comentario \u22642 d\u00edas) y (% cumplimiento en tiempo). <i>Antes usaba cierre \u226448 h sin contar los vencidos abiertos en la misma proporci\u00f3n.</i></li>
  <li>Desempe\u00f1o = (${c.wP}\u00b7P + ${c.wR}\u00b7R + ${c.wO}\u00b7O) \u00f7 ${c.wP + c.wR + c.wO}. M\u00ednimo ${c.minFolios} folios elegibles.</li></ul>
  <h2>6. Auditor\u00eda de calidad (autom\u00e1tica por reglas, sin IA)</h2><p>Se audita cada folio cerrado con gesti\u00f3n manual. Cada criterio se califica Cumple / Parcial / No cumple y guarda la evidencia textual que lo sustenta (visible en el detalle del folio).</p>
  <table><tr><th>Criterio</th><th>Regla</th></tr>
  <tr><td>C1 Claridad</td><td>Texto \u00fatil de las gestiones de personas: \u2265150 caracteres cumple; 60\u2013149 parcial.</td></tr>
  <tr><td>C2 Motivo</td><td>Todos los motivos tienen \u00e1rea y motivo.</td></tr>
  <tr><td>C3 Investigaci\u00f3n</td><td>Menciona revisi\u00f3n/validaci\u00f3n/consulta (historial, sistema, cl\u00ednica, experto, RSV, ticket\u2026): 2+ evidencias cumple; 1 parcial.</td></tr>
  <tr><td>C4 Seguimiento</td><td>Documenta contacto con el paciente (llamada, WhatsApp, correo, buz\u00f3n\u2026) y 2+ gestiones; una de las dos = parcial.</td></tr>
  <tr><td>C5 Evidencia</td><td>Menciona evidencia, captura, adjunto, comprobante, imagen.</td></tr>
  <tr><td>C6 Causa ra\u00edz</td><td>Columna Causas = cumple; inferida del texto de la gesti\u00f3n = parcial; ninguna = no cumple ("No determinable").</td></tr>
  <tr><td>C7 Justificaci\u00f3n</td><td>Las \u00faltimas gestiones explican la resoluci\u00f3n (\u226560 caracteres con t\u00e9rminos de resoluci\u00f3n); texto corto = parcial.</td></tr>
  <tr><td>C8 Tiempos</td><td>1er comentario \u22642 d\u00edas y cierre en la meta; uno de los dos = parcial.</td></tr>
  <tr><td>C9 Cierre</td><td>Todas las clasificaciones PROCEDE/NO PROCEDE; procedente sin acci\u00f3n correctiva = parcial; SIN DEFINIR o vac\u00eda = no cumple.</td></tr></table>
  <p>Ponderaci\u00f3n: C3, C4 y C7 valen 1.5; el resto 1. Puntaje \u2265${c.aud.adecuada} = adecuada; \u2265${c.aud.parcial} = parcialmente adecuada; menor = inadecuada; sin gestiones de personas = informaci\u00f3n insuficiente.</p>
  <p><b>Procedencia:</b> se respeta la clasificaci\u00f3n registrada solo si hay justificaci\u00f3n; si falta justificaci\u00f3n o la clasificaci\u00f3n es SIN DEFINIR/vac\u00eda = <b>No determinable por falta de informaci\u00f3n</b>. Nunca se asume.</p>
  <p><b>Trazabilidad:</b> cada evaluaci\u00f3n se agrega a la hoja Auditoria con fecha, versi\u00f3n de reglas y huella de los datos; si el folio cambia o cambian las reglas, se agrega una evaluaci\u00f3n nueva y las anteriores se conservan.</p>
  <h2>7. Permisos</h2><ul><li>ADMIN: todos los equipos, comparativos, configuraci\u00f3n y procesamiento.</li><li>COORDINADOR: solo las ejecutivas asignadas a su correo en la hoja Equipos. El servidor filtra los datos antes de enviarlos; el detalle de folio y las capturas validan permiso en cada llamada.</li></ul>
  <h2>8. Limitaciones</h2><ul><li>El historial solo trae el d\u00eda de cada gesti\u00f3n, no la hora.</li><li>La evidencia se detecta por menciones en el texto; los adjuntos reales no vienen en el reporte.</li><li>La auditor\u00eda por reglas mide la calidad del registro, no la calidad de la llamada (eso lo cubre el monitoreo).</li></ul></div>`;
}

async function fichaToPdf(e, r) {
  await Promise.all([lib('html2canvas'), lib('jspdf')]);
  Object.values(S.charts).forEach(c => c.destroy()); S.charts = {};
  const tmp = document.createElement('div'); tmp.className = 'pdfsheet'; document.body.appendChild(tmp);
  const wasDark = document.body.classList.contains('dark'); document.body.classList.remove('dark');
  const prev = S.sel.ejec; S.sel.ejec = e; vIndividual(tmp); await sleep(800);
  tmp.querySelectorAll('.noprint').forEach(x => x.remove());
  const rect = tmp.getBoundingClientRect();
  const blocks = [...tmp.children].map(c => { const b = c.getBoundingClientRect(); return { top: b.top - rect.top, h: b.height }; }).filter(b => b.h > 0);
  const scale = 1.6; const cv = await html2canvas(tmp, { scale, backgroundColor: '#F4F7FE', logging: false, windowWidth: 1140 });
  tmp.remove(); S.sel.ejec = prev; if (wasDark) document.body.classList.add('dark'); Object.values(S.charts).forEach(c => c.destroy()); S.charts = {};
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: 'pt', format: 'letter' });
  const PW = 612, PH = 792, M = 24, FOOT = 18, cw = PW - 2 * M, k = cw / rect.width; let y = M, page = 1;
  const footer = () => { pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`${e} \u00b7 ${r.label} \u00b7 p\u00e1gina ${page}`, M, PH - 10); };
  const put = (top, h) => { const c = document.createElement('canvas'); c.width = Math.round(rect.width * scale); c.height = Math.max(1, Math.round(h * scale)); c.getContext('2d').drawImage(cv, 0, Math.round(top * scale), c.width, c.height, 0, 0, c.width, c.height); pdf.addImage(c.toDataURL('image/jpeg', 0.88), 'JPEG', M, y, cw, h * k); y += h * k; };
  const maxH = PH - M - FOOT - M;
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i]; const gap = i + 1 < blocks.length ? blocks[i + 1].top - (b.top + b.h) : 0;
    if (y + b.h * k > PH - M - FOOT && y > M) { footer(); pdf.addPage(); page++; y = M; }
    if (b.h * k <= maxH) put(b.top, b.h); else { let off = 0; while (off < b.h) { const hh = Math.min((PH - M - FOOT - y) / k, b.h - off); put(b.top + off, hh); off += hh; if (off < b.h) { footer(); pdf.addPage(); page++; y = M; } } }
    y += Math.max(0, gap) * k;
  }
  footer(); return pdf;
}
async function pdfIndividual() {

async function pdfEquipoZip() {
  const r = curRange(); const list = team().filter(e => S.folios.some(f => f.owner === e && inR(f.fReg, r)));
  if (!list.length) return toast('No hay ejecutivas con folios en el periodo');

  }

  const blob = await zip.generateAsync({ type: 'blob' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Reportes_individuales_${fname(r.label)}.zip`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  overlay(null); toast(`${list.length} PDFs (uno por ejecutiva) en un ZIP`); S.view = prevView; render();
}

  document.addEventListener('click', ev => { if (!ev.target.closest('.drop')) $$('.drop.on').forEach(x => x.classList.remove('on')); });

function actualizarCampana() {
  try { const r = curRange(); if (!r || !S.folios.length) return; _alertas = computeAlerts(r, prevPeriod(r)); const n = _alertas.filter(a => a.lvl === 'critica').length; const d = $('#bellDot'); d.style.display = n ? 'grid' : 'none'; d.textContent = n > 99 ? '99+' : n; } catch (e) { console.warn(e); }
}

  const A = _alertas.filter(a => a.lvl !== 'seguimiento').slice(0, 6);
  $('#bellDrop').style.width = '420px';
  $('#bellDrop').innerHTML = `<h4>Alertas del periodo<a href="#" onclick="go('alertas');return false">Ver todas</a></h4>${A.length ? A.map(a => `<div class="it" onclick="go('individual',{ejec:'${esc(a.ejec)}'})"><div class="ic ${a.lvl === 'critica' ? 'bad' : 'warn'}"><span class="ms">${a.lvl === 'critica' ? 'priority_high' : 'warning'}</span></div><div style="min-width:0"><b>${esc(a.ind)}</b><span>${esc(a.ejec)} \u00b7 ${esc(a.dato)}</span></div></div>`).join('') : '<div class="muted">Sin alertas en este periodo.</div>'}`;
}
function toggleDark() {
